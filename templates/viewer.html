<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Eff-Vocab Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app">
        <header>
            <h1 class="title">Eff-Vocab Viewer</h1>
        </header>

        <div class="screen-info">
            <span id="counter">{{ initial_progress }}</span>
            <span id="state">[ EN ]</span>
            <div class="timer-controls">
                <span id="timer-text">00:00:00</span>
            </div>
        </div>

        <div class="screen">
            <div class="word-pane" id="title-pane">
                <div id="title-text" class="word-title">{{ initial_word_data.en }}</div>
            </div>
            <div class="word-pane" id="deriv-pane">
                <div id="deriv-text" class="word-deriv"></div>
            </div>
        </div>

        <div class="controls">
            <button id="pass-btn">Pass</button>
            <button id="pause-btn">Pause</button>
            <button id="end-btn">End</button>
        </div>
    </div>
    <script>
        window.initialWordData = {{ initial_word_data | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/viewer.js') }}"></script>
</body>
</html>
