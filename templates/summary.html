<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eff-Vocab Viewer - 요약</title>
    <style>
        body {
            background-color: black; color: cyan; font-family: Helvetica, sans-serif;
            display: flex; flex-direction: column;
            height: calc(var(--vh, 1vh) * 100);
            margin: 0;
            text-align: center;
        }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; width: 100%; box-sizing: border-box; }
        .counter { color: yellow; font-size: 14px; }
        .timer-container { display: flex; align-items: center; }
        .timer { font-size: 14px; border: 1px solid white; padding: 2px 5px; margin-left: 5px; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        h1 { font-size: 24px; }
        .summary-box { border: 1px solid cyan; padding: 20px; width: 90%; max-width: 400px; margin: 20px auto; line-height: 1.8; font-size: 18px; }
        button { font-size: 16px; padding: 10px 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div id="counter" class="counter">{{ final_progress }}</div>
        <div class="timer-container">
            <div id="timer" class="timer">{{ total_time }}</div>
        </div>
    </div>

    <div class="main-content">
        <h1>학습 요약</h1>
        <div class="summary-box">
            Start No: {{ start_idx }} <br>
            진행: {{ total_studied }} 개<br>
            Pass: {{ passed_count }} 개<br>
            학습 시간: {{ total_time }}<br>
            휴식 시간: {{ pause_time }}
        </div>
        <a href="/"><button>처음으로</button></a>
    </div>

    <script>
        // 화면 높이 최적화
        document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
        // 뒤로 가기 막기 (새로운 학습 세션 시작 유도)
        history.pushState(null, null, location.href);
        window.onpopstate = function () { history.go(1); };
    </script>
</body>
</html>
