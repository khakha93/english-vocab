<div class="header">
    <div id="counter" class="counter">{{ counter|default('0 (0)') }}</div>
    {% if state is defined %}
    <div id="state" class="state">{{ state }}</div>
    {% endif %}
    <div class="timer-container">
        {% if timer_button %}
        <button id="timer-btn" class="timer" style="background:none; border:1px solid white; padding:0; margin:0; display:flex; align-items:center; justify-content:center; min-width:80px; min-height:28px;">
            <span id="timer-text" style="width:100%; text-align:center; display:flex; align-items:center; justify-content:center; min-height:24px; padding-top:4px; padding-bottom:4px; line-height:1;">{{ timer|default('00:00:00') }}</span>
        </button>
        {% else %}
        <div id="timer" class="timer">{{ timer|default('00:00:00') }}</div>
        {% endif %}
    </div>
</div>
