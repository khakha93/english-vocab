<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eff-Vocab Viewer</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body id="page-index">
    <div class="app">
        <header>
            <h1 class="title">Eff-Vocab Viewer</h1>
        </header>
        <form id="start-form">
            <div class="form-group">
                <label for="start_index">시작 번호:</label>
                <input type="number" id="start_index" name="start_index" value="1" min="1">
                <span id="max-index-label" class="muted"></span>
            </div>
            <div class="form-group">
                <input type="checkbox" id="is_shuffle" name="is_shuffle">
                <label for="is_shuffle">순서 섞기</label>
            </div>
            <button type="submit" class="primary">학습 시작</button>
        </form>
    </div>
</body>
</html>
